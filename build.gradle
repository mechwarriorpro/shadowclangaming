plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.shadowclangaming'

base {
    // The jar is built as "ShadowClanGaming 1.0.0.jar" so a tester can tell two builds apart at a glance.
    archivesName = 'ShadowClanGaming'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // NeoForge for Minecraft 1.21.1 (latest 21.1.x at time of writing)
    version = '21.1.264'

    // Optional: nicer parameter names in your IDE. Uncomment and check
    // https://mappings.dev for the current Parchment build for 1.21.1.
    // parchment {
    //     minecraftVersion = '1.21.1'
    //     mappingsVersion = '2024.11.17'
    // }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        shadowclangaming {
            sourceSet sourceSets.main
        }
    }
}

// Ship the licence + metadata in the jar.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'ShadowClanGaming',
            'Specification-Vendor'    : 'shadowclangaming',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'shadowclangaming'
        ])
    }
}

