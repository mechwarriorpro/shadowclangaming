plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.3'
group = 'com.sp'

base {
    archivesName = 'destroying-minecraft'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.264'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        'destroying-minecraft' { sourceSet sourceSets.main }
    }
}

repositories {
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    // MidnightConfig — config screen (neoforge variant)
    implementation "eu.midnightdust:midnightlib:1.6.9+1.21-neoforge"
    // Veil — post-processing pipeline (neoforge JarInJar, same as ShadowClanGaming's photoreal path)
    // Original Fabric mod bundled veil-fabric-1.21.1-2.3.2.jar; NeoForge port expects veil-neoforge.
    // If the jar is present in META-INF/jars it is loaded via JarInJar; otherwise fetched from maven.
    // Using plain implementation — ModDev plugin handles deobfuscation automatically (no fg.deobf needed).
    implementation("foundry.veil:veil-neoforge-1.21.1:2.3.2") {
        exclude group: 'maven.modrinth', module: 'midnightlib'
    }
    implementation "gg.moonflower:molang-compiler:3.1.1.19"
    implementation "io.github.ocelot:glsl-processor:0.2.3"
    // Cardinal Components (neoforge port)
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.2"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.2"
    implementation "org.ladysnake.cardinal-components-api:cardinal-components-world:6.1.2"
    // ModMenu — optional, client only
    implementation "com.terraformersmc:modmenu:11.0.3"
    // Sodium — compileOnly, for mixin compat
    compileOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'Destroying Minecraft',
            'Specification-Vendor'  : 'sp',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'sp'
        ])
    }
}
