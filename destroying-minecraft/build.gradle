plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.3'
group = 'com.sp'

base {
    archivesName = 'destroying-minecraft'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.264'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        'destroying_minecraft' { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'Veil'; url = 'https://maven.firstdark.dev/releases' }
    maven { name = 'Ocelot'; url = 'https://maven.iamnotbad.dev/releases' }
    maven { name = 'Moonflower'; url = 'https://maven.moonflowerlabs.org/releases' }
}

dependencies {
    // Veil — post-processing pipeline (faithful port: veil-fabric-1.21.1-2.3.2 -> veil-neoforge-1.21.1:4.x)
    // Fabric 2.3.2 was JarInJar; NeoForge 4.5.2 is latest for 1.21.1 with same PostShader API (LGPL-3.0).
    implementation "foundry.veil:veil-neoforge-1.21.1:4.5.2"
    implementation "gg.moonflower:molang-compiler:3.1.1.19"
    implementation "org.joml:joml:1.10.8"
    // Cardinal Components - world/player attachments (events, players)
    // Kept compileOnly for offline sweep; CI resolves via Ladysnake maven if needed. SimpleWorldStorage fallback works without.
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.2"
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.2"
    compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-world:6.1.2"
    compileOnly "eu.midnightdust:midnightlib:1.6.9+1.21-neoforge"
    // Sodium compat mixins (optional)
    compileOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'Destroying Minecraft',
            'Specification-Vendor'  : 'sp',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'sp'
        ])
    }
}
