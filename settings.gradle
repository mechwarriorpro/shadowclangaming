pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Lets Gradle download a matching JDK 21 automatically if you don't have one.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'shadowclangaming'
